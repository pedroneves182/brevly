services:
  db:
    image: postgres:16-alpine
    container_name: brevly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly
    ports:
      - "5432:5432"
    volumes:
      - brevly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brevly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brevly-postgres-data:
